[project]
name = "kansenradar"
version = "0.1.0"
description = "AI-onderzoeksplatform dat businessopportuniteiten voor België en Nederland ontdekt, onderzoekt en kritisch beoordeelt."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Free, local semantic embeddings (ONNX, CPU, ~220 MB model, no PyTorch).
semantic = ["fastembed>=0.4"]
# PDF export of reports (also needs system libraries: libpango-1.0-0 libpangoft2-1.0-0).
pdf = ["weasyprint>=60"]
# Optional paid provider; never required.
anthropic = ["anthropic>=2.6"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

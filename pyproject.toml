[project]
name = "kansenradar"
version = "0.1.0"
description = "AI-onderzoeksplatform dat businessopportuniteiten voor België en Nederland ontdekt, onderzoekt en kritisch beoordeelt."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
